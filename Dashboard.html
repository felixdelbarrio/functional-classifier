<!doctype html><html lang="es"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:14px system-ui;margin:28px;background:#f4f7fb;color:#123}h1{color:#043b78}.card{background:white;border-radius:12px;padding:20px;margin:16px 0;box-shadow:0 2px 9px #dce4ee}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.ok{color:#08794a}.bad{color:#b12222}.warn{color:#ad6800}progress{width:180px}small{color:#667}#error{color:#b12222}</style></head><body><h1>Functional Classifier</h1><p id="summary">Cargando…</p><p id="error"></p><section class="card"><h2>Jobs de consumidores</h2><table><thead><tr><th>Consumidor</th><th>Job</th><th>Estado</th><th>Avance</th><th>Última actualización</th></tr></thead><tbody id="jobs"></tbody></table></section><section class="card"><h2>Últimas ejecuciones</h2><table><thead><tr><th>Consumidor</th><th>Fecha</th><th>Registros</th><th>Errores</th><th>Duración</th></tr></thead><tbody id="executions"></tbody></table></section><script>const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){google.script.run.withSuccessHandler(s=>{document.getElementById('summary').textContent='Versión '+s.version+' · Catálogo '+(s.revision||'SIN SINCRONIZAR');document.getElementById('jobs').innerHTML=s.jobs.slice().reverse().map(j=>{let pct=j.total?Math.min(100,Math.round(j.processed/j.total*100)):0;let stale=j.status==='RUNNING'&&Date.now()-new Date(j.updatedAt).getTime()>15*60*1000;return '<tr><td>'+esc(j.caller)+'</td><td>'+esc(j.jobId)+'</td><td class="'+(stale?'warn':j.status==='ERROR'?'bad':'ok')+'">'+esc(stale?'SIN ACTUALIZAR':j.status)+'</td><td><progress max="100" value="'+pct+'"></progress> '+pct+'%</td><td>'+esc(j.updatedAt)+'</td></tr>';}).join('');document.getElementById('executions').innerHTML=s.executions.slice().reverse().map(e=>'<tr><td>'+esc(e.caller)+'</td><td>'+esc(e.endedAt)+'</td><td>'+esc(e.total)+'</td><td>'+esc(e.failed)+'</td><td>'+esc(e.durationMs)+' ms</td></tr>').join('');document.getElementById('error').textContent='';}).withFailureHandler(e=>document.getElementById('error').textContent=e.message).fcAdminStatus();}load();setInterval(load,15000);</script></body></html>
